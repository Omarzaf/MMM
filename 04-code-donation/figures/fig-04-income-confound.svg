.7" y="206.6" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" fill="var(--ink-2, #3f3b35)">9.6</text><rect x="150" y="212.0" width="46.7" height="12" fill="var(--ink-5, #8c8578)"/><text x="202.7" y="221.6" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="8.8" fill="var(--ink-2, #3f3b35)">7.6</text><line x1="150" y1="234" x2="670" y2="234" stroke="var(--paper-4, #ddd7c8)"/><rect x="150" y="255" width="11" height="11" fill="#8a5a3b"/><text x="166" y="264" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="var(--ink-4, #726c5e)">eligible for Sponsors</text><rect x="330" y="255" width="11" height="11" fill="var(--ink-5, #8c8578)"/><text x="346" y="264" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="var(--ink-4, #726c5e)">not eligible</text><text x="150" y="286" font-family="'Newsreader', Georgia, serif" font-size="10.5" font-style="italic" fill="var(--ink-4, #726c5e)">The 4.0× gap across all economies falls to 1.3× inside Pakistan’s own income band, and reverses at high income.</text>
